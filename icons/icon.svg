<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="50%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#191e33"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.45"/>

  <!-- Battery Shell Body -->
  <rect x="136" y="160" width="240" height="230" rx="36" fill="#141829" stroke="url(#accentGrad)" stroke-width="14" filter="url(#glow)"/>
  
  <!-- Battery Positive Terminal Cap -->
  <rect x="216" y="124" width="80" height="24" rx="8" fill="#7c5cff"/>

  <!-- Battery Level Fluid (Glowing Green) -->
  <rect x="156" y="270" width="200" height="100" rx="20" fill="#22c55e" fill-opacity="0.85"/>
  <rect x="156" y="270" width="200" height="100" rx="20" fill="url(#accentGrad)" fill-opacity="0.35"/>

  <!-- Lightning Bolt (Charge Symbol) -->
  <polygon points="274,180 200,286 256,286 238,368 316,258 260,258" fill="url(#boltGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Solar Sun Rays Accent (Top-Right) -->
  <circle cx="360" cy="150" r="14" fill="#f59e0b" fill-opacity="0.8"/>
  <line x1="360" y1="122" x2="360" y2="114" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="384" y1="134" x2="392" y2="128" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="392" y1="150" x2="400" y2="150" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="384" y1="166" x2="392" y2="172" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="336" y1="134" x2="328" y2="128" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="336" y1="166" x2="328" y2="172" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
</svg>
